<!DOCTYPE html>
<html lang="es">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

<style>
@font-face { font-family: 'JuegoFuente'; src: url('img/fuente.woff2') format('woff2'), url('img/fuente.ttf') format('truetype'), url('img/fuente.otf') format('opentype'); font-display: swap; }

body { font-family: 'Inter', sans-serif; background-color: #0f172a; touch-action: none; user-select: none; -webkit-user-select: none; overflow: hidden; height: 100dvh; width: 100vw; margin: 0; padding: 0; }
canvas { display: block; touch-action: none; }

.no-scrollbar::-webkit-scrollbar { display: none; } .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
@media (max-width: 640px) { .ui-island { border-radius: 0.75rem; } .btn-action { min-width: 65px; height: 65px; } }

</head>
<body class="relative">

<!-- LOBBY -->
<div id="lobby-ui" class="absolute inset-0 z-50 bg-[#0f172a] flex items-center justify-center p-4 transition-opacity duration-500">
  <div class="ui-island w-full max-w-md p-6 sm:p-8 flex flex-col gap-6">
    <h1 class="text-3xl font-extrabold text-slate-800 text-center">RTS Táctico P2P</h1>
    <div id="setup-section" class="flex flex-col gap-4">
      <input type="text" id="player-name" placeholder="Tu Apodo..." class="p-3 rounded-lg border-2 border-slate-300 outline-none focus:border-blue-500 text-lg font-semibold text-slate-700 bg-white" maxlength="12">
      <p id="peer-status" class="text-sm font-semibold text-center text-slate-500">Conectando a servidor PeerJS...</p>
      <div class="flex gap-2">
        <button id="btn-host" class="flex-1 bg-emerald-600 text-white font-bold py-3 px-2 rounded-lg shadow-md active:scale-95 opacity-50 cursor-not-allowed" disabled>Crear Partida</button>
        <button id="btn-join-ui" class="flex-1 bg-blue-600 text-white font-bold py-3 px-2 rounded-lg shadow-md active:scale-95 opacity-50 cursor-not-allowed" disabled>Unirse</button>
        <button id="btn-singleplayer" class="bg-amber-600 text-white font-bold py-3 px-3 rounded-lg shadow-md active:scale-95">🤖 Solo</button>
      </div>
    </div>
    <div id="host-section" class="hidden flex-col gap-4 items-center">
      <h2 class="text-xl font-bold text-slate-700">Sala Creada</h2>
      <p class="text-sm text-slate-500 text-center">Comparte este código con tu amigo:</p>
      <div class="bg-slate-800 text-white font-mono text-lg py-2 px-4 rounded-lg tracking-widest select-all w-full text-center overflow-x-auto" id="room-code">Cargando...</div>
      <p class="text-sm text-emerald-600 font-semibold animate-pulse" id="host-wait-msg">Esperando rival...</p>
      <button id="btn-cancel-host" class="text-red-500 text-sm font-bold underline">Cancelar</button>
    </div>
    <div id="join-section" class="hidden flex-col gap-4">
      <h2 class="text-xl font-bold text-slate-700">Unirse a Partida</h2>
      <input type="text" id="join-code" placeholder="Pega el código aquí..." class="p-3 rounded-lg border-2 border-slate-300 outline-none focus:border-blue-500 font-mono text-center text-sm bg-white">
      <button id="btn-join-connect" class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-lg shadow-md active:scale-95 text-lg">Conectar</button>
      <button id="btn-cancel-join" class="text-slate-500 text-sm font-bold underline text-center">Volver</button>
    </div>
  </div>
</div>

<!-- GAME OVER -->
<div id="gameover-ui" class="absolute inset-0 z-50 bg-black/80 hidden flex-col items-center justify-center p-4 backdrop-blur-sm transition-opacity duration-500 opacity-0">
  <div class="ui-island p-8 flex flex-col items-center gap-6 max-w-sm w-full">
    <h1 id="gameover-title" class="text-4xl font-extrabold text-center uppercase tracking-wider"></h1>
    <p id="gameover-desc" class="text-slate-600 font-semibold text-center"></p>
    <button onclick="window.location.reload()" class="bg-blue-600 text-white font-bold py-3 px-6 rounded-lg shadow-md active:scale-95 text-lg w-full">Volver al Menú</button>
  </div>
</div>

<div id="game-container" class="absolute inset-0 z-0 bg-[#0f172a] hidden"><canvas id="gameCanvas"></canvas></div>

<!-- UI -->
<div id="ui-layer" class="absolute inset-0 z-10 pointer-events-none p-2 sm:p-4 hidden flex-col justify-between" style="padding-top: var(--safe-top); padding-bottom: var(--safe-bottom);">
  <div class="flex justify-between items-start gap-2">
    <div class="ui-island px-2 py-1.5 sm:px-3 sm:py-2 pointer-events-auto flex gap-2 sm:gap-3 text-xs sm:text-sm font-bold text-slate-800 flex-wrap max-w-[70%]">
      <div class="flex items-center"><img src="img/ui_food.png" class="w-5 h-5 mr-1 object-contain" onerror="this.replaceWith('🥩')"><span id="res-food">200</span></div>
      <div class="flex items-center"><img src="img/ui_wood.png" class="w-5 h-5 mr-1 object-contain" onerror="this.replaceWith('🪵')"><span id="res-wood">200</span></div>
      <div class="flex items-center"><img src="img/ui_gold.png" class="w-5 h-5 mr-1 object-contain" onerror="this.replaceWith('🪙')"><span id="res-gold">100</span></div>
    </div>
    <div class="ui-island px-2 sm:px-3 py-1.5 sm:py-2 pointer-events-auto font-bold text-slate-800 text-xs sm:text-sm flex items-center gap-1"><img src="img/ui_pop.png" class="w-5 h-5 object-contain" onerror="this.replaceWith('👥')"> <span id="pop-count">4/5</span></div>
  </div>
  <div class="flex justify-center mt-2">
    <div id="info-text" class="ui-island px-3 py-1.5 sm:px-4 sm:py-2 font-semibold text-xs sm:text-sm text-slate-700 text-center transition-opacity duration-300 opacity-0">¡Partida Iniciada!</div>
  </div>
  <div class="flex justify-between items-end gap-2 h-24 sm:h-28 mt-auto w-full">
    <div class="pointer-events-auto flex-1 h-full flex items-end min-w-0">
      <div id="action-buttons" class="ui-island p-1.5 flex overflow-x-auto gap-1.5 w-full h-full no-scrollbar hidden items-center overscroll-x-contain"></div>
    </div>
    <div id="minimap-container" class="ui-island w-28 h-28 sm:w-36 sm:h-36 flex-shrink-0 pointer-events-auto overflow-hidden relative border-2 sm:border-4 border-[#cbd5e1] p-0 bg-[#0f172a] touch-none">
      <canvas id="minimapCanvas" class="w-full h-full bg-[#0f172a] rounded-sm block"></canvas>
      <div id="minimap-cam" class="absolute border border-white bg-white/20 pointer-events-none"></div>
    </div>
  </div>
</div>

<script>
/* === RED Y ESTADO === */
let peer = null, peerConn = null, myPeerId = null;
let playerName = "", myTeam = 1, isSinglePlayer = false, gameStatus = 'lobby';
let actionQueue = [], gameTick = 0, lastTime = 0, tickAccumulator = 0, loopStarted = false;
const TICK_RATE = 1000 / 30, TURN_LEN = 3, LOCK_DELAY = 3;
let turnData = {}, publishedTurn = -1, localPending = [], wallStart = null, wallEnd = null;

const canvas = document.getElementById('gameCanvas'), ctx = canvas.getContext('2d');
const minimap = document.getElementById('minimapCanvas'), mCtx = minimap.getContext('2d');
const uiFood = document.getElementById('res-food'), uiWood = document.getElementById('res-wood'), uiGold = document.getElementById('res-gold');
const uiPop = document.getElementById('pop-count'), uiInfo = document.getElementById('info-text');
const actionContainer = document.getElementById('action-buttons'), minimapContainer = document.getElementById('minimap-container');
const minimapCamUI = document.getElementById('minimap-cam');

/* === MAPA Y CÁMARA === */
const TILE_SIZE = 50, MAP_W = 64, MAP_H = 64;
let mapGrid = [], fogGrid = [];
let cam = { x: 0, y: 0 };
let isDragging = false, dragStart = {x:0,y:0}, camStart = {x:0,y:0}, hasMovedDrag = false, isMinimapDragging = false;
let renderScale = 1.0, activePointers = [], initialPinchDist = null, initialScale = 1;
let isDrawingWall = false, lineStart = null;

/* === ENTIDADES === */
let resources = { 1: {food:200, wood:200, gold:100}, 2: {food:200, wood:200, gold:100} };
let units = [], buildings = [], fxList = [];
let selection = null, pendingAction = null, actionTargetData = null;

const U_PEON='peon', U_GUERRERO='guerrero', U_ALFIL='alfil', U_CABALLERO='caballero', U_EXPLORER='explorer';
const B_TOWN_CENTER='tc', B_HOUSE='house', B_BARRACKS='barracks', B_ARCHERY='archery', B_STABLE='stable', B_TOWER='tower', B_WALL='wall', B_GATE='gate';
const R_WOOD='wood', R_GOLD='gold', R_FOOD='food';
const isRes = t => t === R_WOOD || t === R_GOLD || t === R_FOOD;

const COSTS = {
  [U_PEON]:{food:50}, [U_GUERRERO]:{food:60,gold:20}, [U_ALFIL]:{wood:25,gold:45}, [U_CABALLERO]:{food:80,gold:40},
  [B_HOUSE]:{wood:25}, [B_BARRACKS]:{wood:150}, [B_ARCHERY]:{wood:150}, [B_STABLE]:{wood:150,gold:50},
  [B_TOWER]:{wood:50,gold:50}, [B_WALL]:{wood:10}, [B_GATE]:{wood:20}
};
const BUILD_SECS = {wall: 3, gate: 5, house: 12, tower: 20, barracks: 30, archery: 30, stable: 30, tc: 60}; // segundos con 1 peón
const STATS = {
  [U_PEON]:{hp:25,atk:3,range:1.2,speed:0.08,trainTime:120}, [U_GUERRERO]:{hp:45,atk:7,range:1.2,speed:0.06,trainTime:180},
  [U_ALFIL]:{hp:30,atk:5,range:5.5,speed:0.06,trainTime:240}, [U_CABALLERO]:{hp:80,atk:12,range:1.2,speed:0.12,trainTime:260},
  [U_EXPLORER]:{hp:35,atk:4,range:1.2,speed:0.1,trainTime:200}
};

/* === ALEATORIEDAD DETERMINISTA E IDs === */
let _seed = 12345;
function setSeed(s) { _seed = s; }
function seededRandom() {
  let t = _seed += 0x6D2B79F5;
  t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61);
  return ((t ^ t >>> 14) >>> 0) / 4294967296;
}
let idCounter = 0, mapReady = false;
function generateId() {
  if (mapReady) return `c${myTeam}_${idCounter++}`;          // en partida: único por jugador
  return Math.floor(seededRandom() * 1000000000).toString(36); // al generar el mapa: igual en ambos
}

/* === SPRITES (opcionales: si falta el .png se dibuja una forma) === */
const SPRITE_FILES = {
  'construction':'ui_construction.png',
  'bg_grass_light':'bg_grass_light.png', 'bg_grass_dark':'bg_grass_dark.png',
  'res_wood':'res_wood.png', 'res_gold':'res_gold.png', 'res_food':'res_food.png',
  'b_tc_1':'b_tc_1.png','b_house_1':'b_house_1.png','b_barracks_1':'b_barracks_1.png','b_archery_1':'b_archery_1.png','b_stable_1':'b_stable_1.png','b_tower_1':'b_tower_1.png','b_wall_1':'b_wall_1.png','b_gate_1':'b_gate_1.png',
  'b_tc_2':'b_tc_2.png','b_house_2':'b_house_2.png','b_barracks_2':'b_barracks_2.png','b_archery_2':'b_archery_2.png','b_stable_2':'b_stable_2.png','b_tower_2':'b_tower_2.png','b_wall_2':'b_wall_2.png','b_gate_2':'b_gate_2.png',
  'u_peon_1':'u_villager_1.png','u_guerrero_1':'u_infantry_1.png','u_alfil_1':'u_archer_1.png','u_caballero_1':'u_cavalry_1.png','u_explorer_1':'u_explorer_1.png',
  'u_peon_2':'u_villager_2.png','u_guerrero_2':'u_infantry_2.png','u_alfil_2':'u_archer_2.png','u_caballero_2':'u_cavalry_2.png','u_explorer_2':'u_explorer_2.png'
};
const IMG = 'img/';   // carpeta de imágenes (cámbiala si tu carpeta está en otra ruta)
const FONT = "'JuegoFuente', 'Inter', sans-serif";
const loadedSprites = {};
for (let key in SPRITE_FILES) { let img = new Image(); img.src = IMG + SPRITE_FILES[key]; loadedSprites[key] = img; }
function ico(file, emoji, cls = 'w-7 h-7') { return `<img src="${IMG}${file}.png" class="${cls} object-contain inline-block" draggable="false" onerror="this.replaceWith('${emoji}')">`; }
const COST_ICONS = {food: ['ui_food', '🥩'], wood: ['ui_wood', '🪵'], gold: ['ui_gold', '🪙']};
const costHTML = c => Object.keys(c).map(k => `${c[k]}${ico(COST_ICONS[k][0], COST_ICONS[k][1], 'w-3 h-3')}`).join(' ');
const BTN = { peon:['icon_peon','🧑‍🌾'], guerrero:['icon_guerrero','⚔'], alfil:['icon_alfil','🎯'], caballero:['icon_caballero','♞'],
  house:['icon_house','🏠'], barracks:['icon_barracks','⛺'], archery:['icon_archery','🎯'], stable:['icon_stable','🐴'], tower:['icon_tower','🗼'],
  gate:['icon_gate','⛩️'], wall:['icon_wall','🧱'], merge:['icon_merge','🔗'], split:['icon_split','➗'], close:['icon_close','❌'] };
const bi = k => ico(BTN[k][0], BTN[k][1]);

/* === P2P (PeerJS) === */
function initPeer() {
  try {
    peer = new Peer({ config: { iceServers: [{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}] } });
    peer.on('open', id => {
      myPeerId = id;
      document.getElementById('peer-status').innerText = "Conectado. Servidor P2P Listo.";
      ['btn-host','btn-join-ui'].forEach(i => { let b = document.getElementById(i); b.disabled = false; b.classList.remove('opacity-50','cursor-not-allowed'); });
    });
    peer.on('connection', conn => {
      peerConn = conn;
      document.getElementById('host-wait-msg').innerText = "Rival conectado. Configurando...";
      peerConn.on('open', () => {
        setupConnection();
        let gameSeed = Math.floor(Math.random() * 9999999);
        sendData({ type: 'START', seed: gameSeed });
        startGame(gameSeed, 1);
      });
    });
    peer.on('error', err => {
      console.warn("PeerJS Error:", err);
      document.getElementById('peer-status').innerText = "Error de red. Juega Modo Solo 🤖";
    });
  } catch (e) { document.getElementById('peer-status').innerText = "Error. Usa el Modo Solo 🤖"; }
}
const show = (id) => { let e = document.getElementById(id); e.classList.remove('hidden'); e.classList.add('flex'); };
document.getElementById('btn-host').addEventListener('click', () => {
  playerName = document.getElementById('player-name').value.trim() || "Host"; myTeam = 1;
  document.getElementById('setup-section').classList.add('hidden'); show('host-section');
  document.getElementById('room-code').innerText = myPeerId || "Error_ID";
});
document.getElementById('btn-join-ui').addEventListener('click', () => {
  playerName = document.getElementById('player-name').value.trim() || "Invitado"; myTeam = 2;
  document.getElementById('setup-section').classList.add('hidden'); show('join-section');
});
document.getElementById('btn-join-connect').addEventListener('click', () => {
  let code = document.getElementById('join-code').value.trim(); if (!code) return;
  let btn = document.getElementById('btn-join-connect'); btn.innerText = "Conectando...";
  peerConn = peer.connect(code, { reliable: true });
  setupConnection(); // el receptor se registra ANTES de abrir, para no perder START
  peerConn.on('open', () => { btn.innerText = "¡Conectado! Esperando mapa..."; });
  peerConn.on('error', () => { btn.innerText = "Fallo al conectar"; });
});
document.getElementById('btn-singleplayer').addEventListener('click', () => {
  playerName = document.getElementById('player-name').value.trim() || "Comandante"; isSinglePlayer = true; myTeam = 1;
  startGame(Math.floor(Math.random() * 99999), 1);
});
function setupConnection() {
  peerConn.on('data', data => {
    if (data.type === 'START') { if (myTeam === 2) startGame(data.seed, 2); }
    else if (data.type === 'TURN') { if (!turnData[data.turn]) turnData[data.turn] = {}; turnData[data.turn][3 - myTeam] = data.cmds; }
  });
  peerConn.on('close', () => {
    if (gameStatus !== 'playing') return;
    gameStatus = 'gameover';
    let t = document.getElementById('gameover-title'); t.innerText = "¡VICTORIA!"; t.className = "text-5xl font-extrabold text-emerald-500 uppercase tracking-wider";
    document.getElementById('gameover-desc').innerText = "El rival se desconectó.";
    show('gameover-ui'); setTimeout(() => document.getElementById('gameover-ui').classList.remove('opacity-0'), 100);
  });
}
function sendData(o) { if (peerConn && peerConn.open) peerConn.send(o); }
document.getElementById('btn-cancel-host').addEventListener('click', () => location.reload());
document.getElementById('btn-cancel-join').addEventListener('click', () => location.reload());
window.onload = initPeer;

/* === INICIO DE PARTIDA === */
function startGame(mapSeed, assignedTeam) {
  if (gameStatus === 'playing') return;
  myTeam = assignedTeam; gameStatus = 'playing'; gameTick = 0;
  turnData = {}; publishedTurn = -1; localPending = []; actionQueue = [];
  for (let t = 0; t < LOCK_DELAY; t++) turnData[t] = {1: [], 2: []};
  document.getElementById('lobby-ui').style.opacity = '0';
  setTimeout(() => {
    document.getElementById('lobby-ui').classList.add('hidden');
    document.getElementById('game-container').classList.remove('hidden');
    show('ui-layer');
    setSeed(mapSeed); generateMap();
    lastTime = performance.now(); tickAccumulator = 0;
    if (!loopStarted) { loopStarted = true; requestAnimationFrame(gameLoop); }
    resize();
  }, 500);
}
function sendCmd(cmd) {
  cmd.team = myTeam;
  if (isSinglePlayer) { cmd.tick = gameTick + 1; actionQueue.push(cmd); }
  else localPending.push(cmd); // se envía en el siguiente turno (lockstep)
}

/* === GENERACIÓN DEL MAPA === */
function generateMap() {
  units = []; buildings = []; idCounter = 0; mapReady = false;
  for (let x = 0; x < MAP_W; x++) { mapGrid[x] = []; fogGrid[x] = []; for (let y = 0; y < MAP_H; y++) { mapGrid[x][y] = 1; fogGrid[x][y] = 0; } }
  // Bases simétricas respecto al centro, en posición y esquina aleatorias (siempre lejos entre sí)
  let bx = 5 + Math.floor(seededRandom() * 13), by = 5 + Math.floor(seededRandom() * 13);
  if (seededRandom() > 0.5) bx = MAP_W - 2 - bx;
  if (seededRandom() > 0.5) by = MAP_H - 2 - by;
  let A = {x: bx, y: by}, B = {x: MAP_W - 2 - bx, y: MAP_H - 2 - by};
  let [p1, p2] = seededRandom() > 0.5 ? [A, B] : [B, A];
  [[p1, 1], [p2, 2]].forEach(([p, team]) => {
    createBuilding(B_TOWN_CENTER, p.x, p.y, 2, team, true);
    createUnit(U_PEON, p.x + 2, p.y + 2, 1, team); createUnit(U_PEON, p.x - 1, p.y + 2, 1, team); createUnit(U_EXPLORER, p.x + 2, p.y - 1, 1, team);
  });
  const tryRes = (type, x, y, safe) => {
    if (safe && [p1, p2].some(p => Math.hypot(x - p.x - 0.5, y - p.y - 0.5) < 5)) return;
    if (!isOccupied(x, y, 1)) createBuilding(type, x, y, 1, 0, true);
  };
  // Recursos iniciales junto a cada base (hacia el centro del mapa)
  [p1, p2].forEach(p => {
    let sx = p.x < MAP_W / 2 ? 1 : -1, sy = p.y < MAP_H / 2 ? 1 : -1;
    const at = (type, o) => tryRes(type, sx > 0 ? p.x + 1 + o[0] : p.x - o[0], sy > 0 ? p.y + 1 + o[1] : p.y - o[1]);
    [[4,0],[4,2],[5,1],[5,3]].forEach(o => at(R_FOOD, o));
    [[0,5],[2,5],[1,6]].forEach(o => at(R_GOLD, o));
    [[6,6],[7,6],[6,7],[7,7],[8,6],[6,8]].forEach(o => at(R_WOOD, o));
  });
  // Comida y oro repartidos al azar (espejados para que sea justo)
  for (let i = 0; i < 24; i++) {
    let rx = 2 + Math.floor(seededRandom() * (MAP_W - 4)), ry = 2 + Math.floor(seededRandom() * (MAP_H - 4)), type = seededRandom() > 0.4 ? R_FOOD : R_GOLD;
    tryRes(type, rx, ry, true); tryRes(type, MAP_W - 1 - rx, MAP_H - 1 - ry, true);
  }
  // Bosques con parámetros aleatorios por partida
  let f1 = 0.1 + seededRandom() * 0.15, f2 = 0.1 + seededRandom() * 0.15, f3 = 0.05 + seededRandom() * 0.1;
  let o1 = seededRandom() * 20, o2 = seededRandom() * 20, o3 = seededRandom() * 20, thr = 1.35 + seededRandom() * 0.5;
  let cX = MAP_W / 2, cY = MAP_H / 2;
  for (let x = 0; x < MAP_W; x++) for (let y = 0; y < MAP_H; y++) {
    let noise = Math.sin(x * f1 + o1) + Math.cos(y * f2 + o2) + Math.sin((x + y) * f3 + o3);
    if (noise > thr && Math.hypot(x - cX, y - cY) > 4 && Math.hypot(x - p1.x, y - p1.y) > 8 && Math.hypot(x - p2.x, y - p2.y) > 8) {
      tryRes(R_WOOD, x, y); tryRes(R_WOOD, MAP_W - 1 - x, MAP_H - 1 - y);
    }
  }
  // Garantiza que exista un camino entre las bases
  if (!findPath(p1.x, p1.y, p2.x, p2.y, 1, null, 6000)) {
    let pts = getLinePoints(p1.x, p1.y, p2.x, p2.y);
    buildings = buildings.filter(b => !(b.type === R_WOOD && pts.some(q => Math.abs(q.x - b.gridX) <= 1 && Math.abs(q.y - b.gridY) <= 1)));
  }
  let me = myTeam === 1 ? p1 : p2;
  cam.x = Math.max(0, me.x * TILE_SIZE - window.innerWidth / 2); cam.y = Math.max(0, me.y * TILE_SIZE - window.innerHeight / 2);
  mapReady = true;
  updateFog();
}

  for (let u of units) if (u.team === myTeam || fogGrid[Math.floor(u.x)][Math.floor(u.y)] === 2) { mCtx.fillStyle = u.team === myTeam ? '#93c5fd' : '#fca5a5'; mCtx.fillRect(u.x * mx - mx / 2, u.y * my - my / 2, mx * 1.5, my * 1.5); }
  for (let x = 0; x < MAP_W; x++) for (let y = 0; y < MAP_H; y++) {
    if (fogGrid[x][y] === 1) { mCtx.fillStyle = 'rgba(15,23,42,0.55)'; mCtx.fillRect(x * mx, y * my, mx, my); }
    else if (fogGrid[x][y] === 0) { mCtx.fillStyle = '#0f172a'; mCtx.fillRect(x * mx, y * my, mx, my); }
  }
}
function resize() {
  if (gameStatus !== 'playing') return;
  canvas.width = window.innerWidth; canvas.height = window.innerHeight; minimap.width = 144; minimap.height = 144;
  clampCam(); draw();
}
window.addEventListener('resize', resize);

/* === BUCLE PRINCIPAL === */
function gameLoop(ts) {
  let dt = ts - lastTime; lastTime = ts;
  if (gameStatus === 'playing') {
    tickAccumulator += dt;
    let guard = 10;
    while (tickAccumulator >= TICK_RATE && guard > 0 && gameStatus === 'playing') {
      if (simulationUpdate() === false) { tickAccumulator = Math.min(tickAccumulator, TICK_RATE * 3); break; } // esperando al rival
      tickAccumulator -= TICK_RATE; guard--;
    }
    if (guard === 0) tickAccumulator = 0;
    draw();
  }
  requestAnimationFrame(gameLoop);
}
</script>
